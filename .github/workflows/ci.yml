name: Java Hello World CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Compile Java
        run: javac -d out src/Main.java

      - name: Run compiled Java
        run: java -cp out Main

      - name: Create JAR
        run: jar --create --file hello-java.jar --main-class Main -C out .

      - name: Run JAR
        run: java -jar hello-java.jar

      - name: Build Docker image
        run: docker build -t hello-java .

      - name: Run Docker container
        run: docker run --rm hello-java

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-java
          path: hello-java.jar